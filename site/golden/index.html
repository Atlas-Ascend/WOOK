<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>WOOK — Press Start, Probably.</title>
<link rel="stylesheet" href="style.css"></head>
<body>
<main class="cabinet">
  <div class="brand"><b>WOOK</b><span>PRESS START, PROBABLY.</span></div>
  <div class="bezel"><canvas id="screen" width="160" height="144" aria-label="WOOK game"></canvas></div>
  <div class="controls">
    <div class="dpad">
      <button data-key="up">▲</button>
      <button data-key="left">◀</button><span></span><button data-key="right">▶</button>
      <button data-key="down">▼</button>
    </div>
    <div class="action">
      <button data-key="a" class="round">A</button>
      <button data-key="b" class="round">B</button>
      <button data-key="start">START</button>
      <button data-key="phone">PHONE</button>
    </div>
  </div>
  <div class="footer">GROUND SCORE ECONOMY ACTIVE · STAY HYDRATED · STAY GROUNDED.</div>
</main>
<script src="app.js"></script>
</body></html>
