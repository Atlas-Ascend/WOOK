schema: wook.character-asset-contract.v2
campaign: GA-WOOK-V4-CHARACTER-DETAIL-001
engine: GB Studio 4.3.2
baseline: native-v4-proven
canon_status: frozen

laws:
  - no_toolchain_rebuild_without_failed_diagnostic
  - no_default_gb_studio_actor_in_final_golden_scene
  - no_unbound_production_art_counts_as_complete
  - source_art_and_native_exports_are_separate
  - stable_resource_ids_preferred_over_asset_churn
  - canonical_named_cast_only_in_forward_production
  - deprecated_placeholder_names_are_provenance_only
  - unnamed_supporting_roles_remain_functional_until_intentionally_named

paths:
  source_root: art/source/characters
  native_sprites: game/project/assets/sprites
  native_avatars: game/project/assets/avatars
  scenes: game/project/project/scenes
  proof: docs/proof/receipts

canonical_named_cast:
  - papa_wook
  - train_station
  - loki
  - the_wizard
  - bufo_d_clown
  - handstand_dan
  - sniffany

deprecated_placeholder_identities:
  - moonbeam_jessica
  - sage_trevor
  - trent
  - space_dave
  - solar_charger_guy
  - dj_maybe_greg
  - lost_kyle
  - vanessa_van_person

migration_law:
  aliases_allowed: false
  automatic_one_to_one_identity_mapping: false
  historical_receipts_may_retain_legacy_strings: true
  new_gbsres_may_use_legacy_identity: false
  new_dialogue_may_use_legacy_identity: false

